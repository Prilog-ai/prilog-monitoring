[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prilog-monitoring"
version = "0.1.0"
description = "OpenTelemetry logs, traces and exception capture for Prilog"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Prilog"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: System :: Monitoring",
]
dependencies = ["opentelemetry-sdk>=1.31,<2", "opentelemetry-exporter-otlp-proto-http>=1.31,<2"]

[project.urls]
Homepage = "https://prilog.ai"
Repository = "https://github.com/Prilog-ai/prilog-monitoring"
Documentation = "https://github.com/Prilog-ai/prilog-monitoring/tree/main/python"
Issues = "https://github.com/Prilog-ai/prilog-monitoring/issues"

[tool.setuptools.packages.find]
include = ["prilog_monitoring*"]

[tool.setuptools]
include-package-data = false
